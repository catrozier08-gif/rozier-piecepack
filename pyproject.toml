[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rozier-piecepack"
version = "0.3.0"
description = "Zero-swap layout fallback for Qiskit when the circuit's interaction graph is split into pieces"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Chris Rozier" }]
requires-python = ">=3.10"
dependencies = ["rustworkx>=0.15"]
keywords = ["qiskit", "transpiler", "layout", "vf2", "subgraph isomorphism", "heavy-hex"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
qiskit = ["qiskit>=2.0"]
examples = ["qiskit>=2.0", "qiskit-ibm-runtime", "networkx"]
test = ["pytest", "qiskit>=2.0"]

[project.urls]
Homepage = "https://rozierquantum.com"
Source = "https://github.com/catrozier08-gif/rozier-piecepack"
"Qiskit issue" = "https://github.com/Qiskit/qiskit/issues/17609"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
